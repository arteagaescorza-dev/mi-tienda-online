name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tienda_ropa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Install NPM dependencies
        run: npm install

      - name: Copy environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Configure database
        run: |
          php -r "file_put_contents('.env', str_replace(['DB_CONNECTION=mysql','DB_HOST=127.0.0.1','DB_PORT=3306','DB_DATABASE=laravel','DB_USERNAME=root','DB_PASSWORD='], ['DB_CONNECTION=mysql','DB_HOST=127.0.0.1','DB_PORT=3306','DB_DATABASE=tienda_ropa','DB_USERNAME=root','DB_PASSWORD=password'], file_get_contents('.env')));"

      - name: Wait for MySQL
        run: |
          until php -r "try { new PDO('mysql:host=127.0.0.1;port=3306;dbname=tienda_ropa', 'root', 'password'); echo 'ok'; } catch (Throwable $e) { exit(1); }"; do sleep 1; done

      - name: Run migrations
        run: php artisan migrate --force

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test
